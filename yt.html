<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000}
  /* phóng video cho kín màn hình (tỉ lệ 16:9) */
  iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:0;
    width:100vw;height:56.25vw;min-height:100vh;min-width:177.78vh}
</style>
</head>
<body>
<iframe id="yt" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
// Đưa file này lên web https (ví dụ GitHub Pages). Cách dùng: yt.html?v=ID_VIDEO
const id = encodeURIComponent(new URLSearchParams(location.search).get("v") || "");
if (id) document.getElementById("yt").src =
  "https://www.youtube.com/embed/04QhL6JuQDg" + id +
  "?autoplay=1&mute=1&controls=0&loop=1&playlist=" + id + "&playsinline=1&rel=0";
</script>
</body>
</html>
